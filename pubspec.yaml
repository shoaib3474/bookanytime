name: bookanytime
description: "BookAnytime - Flutter Booking Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # STATE MANAGEMENT
  get: ^4.6.6
  get_storage: ^2.1.1

  # NETWORKING
  dio: ^5.9.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
#  dio_cache_interceptor: ^3.5.1
#  dio_cache_interceptor_hive_store: ^3.2.2

  hive: ^2.2.3
  path_provider: ^2.1.4

  # IMAGES (PINNED FOR FIREBASE COMPATIBILITY)
  cached_network_image: 3.4.0
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2

  # LAYOUTS
  flutter_staggered_grid_view: ^0.7.0

  # DATE & PHONE
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  date_picker_timeline: ^1.2.6

  # WEB
  webview_flutter: ^4.9.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.0

  # FIREBASE (COMPATIBLE SET)
  firebase_core: ^2.29.0
  firebase_auth: ^4.19.1
  cloud_firestore: ^4.16.1
  firebase_storage: ^11.7.1
  firebase_messaging: ^14.8.1

  # MAPS
  google_maps_flutter: ^2.6.1
  map_launcher: ^3.5.0

  # UTIL
  collection: ^1.18.0
  google_maps_place_picker_mb: ^3.1.2
  dio_cache_interceptor: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/icon/
    - config/
